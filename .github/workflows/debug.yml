name: Debug
on: workflow_dispatch
jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile -t fct .
      - run: |
          sudo mkdir -p /tmp/pbdata
          docker run -d --name fc -p 8090:8090 -e TZ=Europe/Berlin -e PB_ADMIN_EMAIL=a@b.de -e PB_ADMIN_PASSWORD=adminadmin123 -v /tmp/pbdata:/pb/pb_data fct
          for i in $(seq 1 30); do curl -fs localhost:8090/api/health >/dev/null && break; sleep 1; done
          J='Content-Type: application/json'
          curl -s -XPOST localhost:8090/api/collections/users/records -H "$J" -d '{"email":"x@y.de","password":"testpasswort123","passwordConfirm":"testpasswort123","name":"Anna"}' >/dev/null
          T=$(curl -s -XPOST localhost:8090/api/collections/users/auth-with-password -H "$J" -d '{"identity":"x@y.de","password":"testpasswort123"}' | jq -r .token)
          echo "== create family"; curl -s -XPOST localhost:8090/api/collections/families/records -H "$J" -H "Authorization: $T" -d '{"name":"F"}'; echo
          S=$(curl -s -XPOST localhost:8090/api/collections/_superusers/auth-with-password -H "$J" -d '{"identity":"a@b.de","password":"adminadmin123"}' | jq -r .token)
          echo "== families (superuser)"; curl -s localhost:8090/api/collections/families/records -H "Authorization: $S"; echo
          echo "== memberships (superuser)"; curl -s localhost:8090/api/collections/memberships/records -H "Authorization: $S"; echo
          echo "== GET as Anna"; curl -s localhost:8090/api/collections/families/records -H "Authorization: $T"; echo
          echo "== auth-refresh"; curl -s -XPOST localhost:8090/api/collections/users/auth-refresh -H "Authorization: $T" | jq -c '{id: .record.id, err: .message}'
          echo "== rule"; curl -s localhost:8090/api/collections/families -H "Authorization: $S" | jq -c '{listRule,viewRule,fields:[.fields[]|{name,type,collectionId,maxSelect}]}'
          echo "== users col"; curl -s localhost:8090/api/collections/users -H "Authorization: $S" | jq -c '{id,name}'
          U=$(curl -s -XPOST localhost:8090/api/collections/users/auth-refresh -H "Authorization: $T" | jq -r .record.id)
          for F in "members ?= '$U'" "members.id ?= '$U'" "members ~ '$U'" "owner = '$U'" "members:each = '$U'"; do
            echo "== filter $F"; curl -s -G localhost:8090/api/collections/families/records -H "Authorization: $S" --data-urlencode "filter=$F" | jq -c '{n: .totalItems, m: .message}'
          done
          for F in "members ?= @request.auth.id" "members.id ?= @request.auth.id" "owner = @request.auth.id" "@request.auth.id != ''"; do
            echo "== as-anna $F"; curl -s -G localhost:8090/api/collections/families/records -H "Authorization: $T" --data-urlencode "filter=$F" | jq -c '{n: .totalItems, m: .message}'
          done
          echo "== logs"; curl -s "localhost:8090/api/logs?perPage=30&sort=-created" -H "Authorization: $S" | jq -c '.items[] | {level,message,data}' | head -20
      - if: always()
        run: docker logs fc 2>&1 | tail -40
