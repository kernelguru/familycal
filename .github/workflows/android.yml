name: Android-APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Version aus Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Abhängigkeiten installieren
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npx expo install --fix

      - name: Android-Projekt erzeugen
        run: npx expo prebuild --platform android --clean

      - name: Keystore bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "FAMILYCAL_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein ANDROID_KEYSTORE_BASE64-Secret – APK wird mit Debug-Key signiert. Spätere Updates mit eigenem Key erfordern eine Neuinstallation."
          fi

      - name: APK bauen
        working-directory: app/android
        env:
          FAMILYCAL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FAMILYCAL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FAMILYCAL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/FamilyCal-${APP_VERSION:-dev}-${BUILD_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FamilyCal-android
          path: FamilyCal-*.apk

      - name: An Release anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FamilyCal-*.apk
