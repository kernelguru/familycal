name: Integration

on:
  push:
    branches: [main]
    paths: ['server/**', 'shared/**', 'tests/integration/**', '.github/workflows/integration.yml']
  pull_request:
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server-Image bauen
        run: docker build -f server/Dockerfile -t familycal-test .
      - name: Server starten (Bind-Mount als root, wie bei docker compose)
        run: |
          sudo mkdir -p /tmp/pbdata && sudo chown root:root /tmp/pbdata
          docker run -d --name fc -p 8090:8090 -e TZ=Europe/Berlin -v /tmp/pbdata:/pb/pb_data familycal-test
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8090/api/health && break; sleep 1; done
      - name: API-Ablauf testen
        run: node tests/integration/api.mjs
      - name: Server-Log
        if: always()
        run: docker logs fc
