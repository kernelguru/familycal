name: iOS-IPA (unsigniert)

# Baut eine unsignierte IPA zum Sideloaden (AltStore, SideStore, Sideloadly …).
# Teuer: macOS-Minuten zählen bei privaten Repos zehnfach – deshalb nur bei
# Tags oder manuell.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    # Falls das Label (noch) nicht verfügbar ist: macos-15 verwenden
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version aus Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Abhängigkeiten installieren
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --legacy-peer-deps --no-audit --no-fund; fi
          npx expo install --fix

      - name: iOS-Projekt erzeugen (inkl. CocoaPods)
        run: npx expo prebuild --platform ios --clean

      - name: Archiv bauen (ohne Signatur)
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          xcodebuild archive \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: IPA verpacken
        run: |
          cd "$RUNNER_TEMP"
          rm -rf Payload && mkdir Payload
          cp -R "app.xcarchive/Products/Applications/$SCHEME.app" Payload/
          zip -qry "$GITHUB_WORKSPACE/FamilyCal-${APP_VERSION:-dev}-${BUILD_NUMBER}-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FamilyCal-ios
          path: FamilyCal-*.ipa

      - name: An Release anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FamilyCal-*.ipa
